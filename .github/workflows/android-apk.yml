name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.QDS_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - run: npm ci

      # Upload keystore secret'ları varsa: Play'e yüklenebilir imzalı AAB + APK.
      # Yoksa: repodaki debug keystore ile imzalı APK (sadece sideload için).
      - name: Prepare signing
        working-directory: android
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/upload.keystore
            {
              echo "SIGN_ARGS=-PMYAPP_UPLOAD_STORE_FILE=upload.keystore -PMYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.QDS_KEYSTORE_PASSWORD }} -PMYAPP_UPLOAD_KEY_ALIAS=${{ secrets.QDS_KEY_ALIAS }} -PMYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.QDS_KEYSTORE_PASSWORD }}"
              echo "TASKS=assembleRelease bundleRelease"
            } >> "$GITHUB_ENV"
          else
            {
              echo "SIGN_ARGS=-PMYAPP_UPLOAD_STORE_FILE=debug.keystore -PMYAPP_UPLOAD_STORE_PASSWORD=android -PMYAPP_UPLOAD_KEY_ALIAS=androiddebugkey -PMYAPP_UPLOAD_KEY_PASSWORD=android"
              echo "TASKS=assembleRelease"
            } >> "$GITHUB_ENV"
          fi

      - name: Build release
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew $TASKS --no-daemon $SIGN_ARGS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk QDS.apk
          FILES="QDS.apk"
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab QDS.aab
            FILES="$FILES QDS.aab"
          fi
          gh release create "build-${{ github.run_number }}" $FILES \
            --title "QDS build ${{ github.run_number }}" \
            --notes "Commit ${{ github.sha }}" \
            --latest
